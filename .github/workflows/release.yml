name: Publish Aversio to Maven Central

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: Select Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Import GPG signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ ! "$RELEASE_VERSION" == v* ]]; then
            echo "Release tag must use the vX.Y.Z format: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag is not a stable SemVer value: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Validate publishing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "Required Actions secret is missing or empty: $name" >&2
              exit 1
            fi
          done

      - name: Publish to Maven Central
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.event.release.tag_name }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set +e
          set -uo pipefail
          log_file="$RUNNER_TEMP/maven-central-publish.log"
          version="${RELEASE_VERSION#v}"

          mvn -B --no-transfer-progress \
            -Dversioning.disable=true \
            -Drevision="$version" \
            -Dcentral.autoPublish=true \
            -Dcentral.waitUntil=published \
            -Dflatten.mode=resolveCiFriendliesOnly \
            -DupdatePomFile=true \
            -Prelease \
            org.codehaus.mojo:flatten-maven-plugin:1.7.3:flatten \
            deploy 2>&1 | tee "$log_file"
          maven_status=${PIPESTATUS[0]}

          if [[ "$maven_status" -ne 0 ]]; then
            deployment_id="$(grep -Eo 'deploymentId: [0-9a-f-]+' "$log_file" | tail -n 1 | cut -d' ' -f2)"
            if [[ -n "$deployment_id" ]]; then
              central_token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
              status_response="$(curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $central_token" \
                --header 'Accept: application/json' \
                "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id" || true)"
              echo 'Sonatype deployment status:'
              if ! echo "$status_response" | jq '{deploymentState, purls, errors}'; then
                echo "$status_response"
              fi
            else
              echo 'Could not find a Sonatype deployment ID in the Maven output.' >&2
            fi
          fi

          exit "$maven_status"
